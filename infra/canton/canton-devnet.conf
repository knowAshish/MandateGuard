// Canton DevNet Participant Node Topology & Runtime Configuration
// Designed for Canton v3.6.1 runtime

canton {
  participants {
    mandateguard_participant {
      storage {
        type = memory
        // For production deployments, substitute with Postgres:
        // type = postgres
        // config {
        //   dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
        //   properties {
        //     serverName = "postgres"
        //     portNumber = 5432
        //     databaseName = "canton_participant"
        //     user = "mandateguard"
        //     password = "mandateguard_dev_password"
        //   }
        // }
      }

      admin-api {
        port = 5012
        address = "0.0.0.0"
      }

      ledger-api {
        port = 7575
        address = "0.0.0.0"

        // JSON Ledger API v2 exposure
        user-management-service {
          enabled = true
        }

        rate-limit {
          max-commands-in-flight = 1000
        }
      }

      init {
        // Operator party allocated upon bootstrap
        parameters {
          unique-contract-keys = false
          unsafe-enable-preview-features = false
        }
      }
    }
  }

  // Canton synchronization domain connection settings
  features {
    enable-preview-commands = false
    enable-testing-commands = false
  }
}
